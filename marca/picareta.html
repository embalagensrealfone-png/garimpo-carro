<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Garimpo Carro — picareta</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ouro:#F2B705;--tinta:#17140F}
body{margin:0;background:#EFEEE9;font-family:'Barlow Condensed'}
.op{display:grid;grid-template-columns:110px 1fr 1fr 150px;border-bottom:2px solid var(--tinta)}
.op>div{height:190px;display:grid;place-items:center}
.n{font:800 3rem/1 'Barlow Condensed';justify-self:center;align-self:center}
.am{background:var(--ouro)}.br{background:#fff}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <!-- picareta clássica: cabeça em meia-lua, cabo inclinado -->
  <symbol id="pic1" viewBox="-50 -50 100 100">
   <g transform="rotate(-38)">
    <rect x="-6" y="-14" width="12" height="62" rx="6"/>
    <path d="M-46 8 C-32 -22 32 -22 46 8 L40 11 C26 -6 -26 -6 -40 11 Z"/>
    <rect x="-9.5" y="-20" width="19" height="17" rx="3.5"/>
   </g>
  </symbol>
  <!-- picareta cuja cabeça é o perfil do carro: para-brisa curto na frente, caída fastback atrás -->
  <symbol id="pic2" viewBox="-50 -50 100 100">
   <g transform="rotate(-38)">
    <rect x="-6" y="-12" width="12" height="60" rx="6"/>
    <path d="M-46 6 L-40 1 C-30 -6 -24 -9 -18 -16 C-12 -22 10 -22 20 -14 C30 -7 38 -2 46 6 L42 9 C33 2 26 -2 18 -7 C8 -13 -8 -13 -16 -8 C-24 -3 -32 3 -42 10 Z"/>
    <rect x="-9.5" y="-18" width="19" height="15" rx="3.5"/>
   </g>
  </symbol>
 </defs>
</svg>
<div class="op"><p class="n">P1</p><div class="am"><svg width="330" height="92" viewBox="0 0 330 92"><use href="#pic1" x="0" y="2" width="88" height="88" fill="#17140F"/><g transform="translate(4,62) scale(1.25)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#fff"/></g><text x="98" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="99" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div><div class="br"><svg width="330" height="92" viewBox="0 0 330 92"><use href="#pic1" x="0" y="2" width="88" height="88" fill="#17140F"/><g transform="translate(4,62) scale(1.25)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#F2B705"/></g><text x="98" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="99" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div><div class="am"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/><use href="#pic1" x="8" y="6" width="80" height="80" fill="#F2B705"/><g transform="translate(10,62) scale(1.05)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#F2B705"/></g></svg></div></div><div class="op"><p class="n">P2</p><div class="am"><svg width="330" height="92" viewBox="0 0 330 92"><use href="#pic2" x="0" y="2" width="88" height="88" fill="#17140F"/><g transform="translate(4,62) scale(1.25)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#fff"/></g><text x="98" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="99" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div><div class="br"><svg width="330" height="92" viewBox="0 0 330 92"><use href="#pic2" x="0" y="2" width="88" height="88" fill="#17140F"/><g transform="translate(4,62) scale(1.25)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#F2B705"/></g><text x="98" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="99" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div><div class="am"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/><use href="#pic2" x="8" y="6" width="80" height="80" fill="#F2B705"/><g transform="translate(10,62) scale(1.05)"><polygon points="0,6 4,-3 12,-6 19,-2 20,6 14,12 5,12" fill="#F2B705"/></g></svg></div></div><div class="op"><p class="n">P3</p>
<div class="am"><svg width="330" height="92" viewBox="0 0 330 92"><rect x="2" y="4" width="84" height="84" rx="18" fill="#17140F"/><use href="#pic1" x="6" y="6" width="76" height="76" fill="#F2B705"/><text x="102" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="103" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div>
<div class="br"><svg width="330" height="92" viewBox="0 0 330 92"><rect x="2" y="4" width="84" height="84" rx="18" fill="#F2B705"/><use href="#pic1" x="6" y="6" width="76" height="76" fill="#17140F"/><text x="102" y="48" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text><text x="103" y="80" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text></svg></div>
<div class="am"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/><use href="#pic1" x="10" y="8" width="76" height="76" fill="#F2B705"/></svg></div></div>
</body></html>
