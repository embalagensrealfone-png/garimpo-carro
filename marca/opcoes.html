<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garimpo Carro — opções de logo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ouro:#F2B705;--tinta:#17140F;--cal:#EFEEE9}
  body{margin:0;background:var(--cal);font-family:Barlow,sans-serif;color:var(--tinta)}
  .op{display:grid;grid-template-columns:120px 1fr 1fr 150px;align-items:center;gap:0;border-bottom:2px solid var(--tinta)}
  .op>div{height:190px;display:grid;place-items:center}
  .n{font:800 3.2rem/1 'Barlow Condensed';justify-self:center}
  .amarelo{background:var(--ouro)} .branco{background:#fff} .preto{background:var(--tinta)}
  svg{display:block}
</style></head><body>

<!-- A: Pepita facetada + palavra -->
<div class="op"><p class="n">A</p>
  <div class="amarelo"><svg width="330" height="90" viewBox="0 0 330 90">
    <g transform="translate(4,8)">
      <polygon points="8,52 18,20 44,6 68,16 78,44 64,70 30,74" fill="#17140F"/>
      <polygon points="18,20 44,6 40,34" fill="#3A3226"/><polygon points="44,6 68,16 40,34" fill="#2A241B"/>
      <polygon points="40,34 68,16 78,44" fill="#F7CF3D"/><polygon points="8,52 18,20 40,34" fill="#0E0C09"/>
      <polygon points="40,34 78,44 64,70" fill="#C99503"/><polygon points="8,52 40,34 30,74" fill="#2A241B"/>
    </g>
    <text x="98" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="99" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="branco"><svg width="330" height="90" viewBox="0 0 330 90">
    <g transform="translate(4,8)">
      <polygon points="8,52 18,20 44,6 68,16 78,44 64,70 30,74" fill="#17140F"/>
      <polygon points="18,20 44,6 40,34" fill="#3A3226"/><polygon points="44,6 68,16 40,34" fill="#2A241B"/>
      <polygon points="40,34 68,16 78,44" fill="#F2B705"/><polygon points="8,52 18,20 40,34" fill="#0E0C09"/>
      <polygon points="40,34 78,44 64,70" fill="#C99503"/><polygon points="8,52 40,34 30,74" fill="#2A241B"/>
    </g>
    <text x="98" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="99" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="amarelo"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/>
    <g transform="translate(9,9)"><polygon points="8,52 18,20 44,6 68,16 78,44 64,70 30,74" fill="#F2B705"/>
      <polygon points="18,20 44,6 40,34" fill="#F7CF3D"/><polygon points="40,34 78,44 64,70" fill="#C99503"/><polygon points="8,52 40,34 30,74" fill="#DDA704"/></g></svg></div>
</div>

<!-- B: Lupa que é roda -->
<div class="op"><p class="n">B</p>
  <div class="amarelo"><svg width="340" height="90" viewBox="0 0 340 90">
    <g transform="translate(6,6)" fill="none" stroke="#17140F">
      <circle cx="36" cy="36" r="30" stroke-width="9"/>
      <circle cx="36" cy="36" r="8" fill="#17140F" stroke="none"/>
      <g stroke-width="5" stroke-linecap="round"><line x1="36" y1="28" x2="36" y2="12"/><line x1="43.6" y1="38.5" x2="58.8" y2="43.4"/><line x1="40.7" y1="42.5" x2="50.1" y2="55.4"/><line x1="31.3" y1="42.5" x2="21.9" y2="55.4"/><line x1="28.4" y1="38.5" x2="13.2" y2="43.4"/></g>
      <line x1="58" y1="58" x2="76" y2="76" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="100" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="101" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="branco"><svg width="340" height="90" viewBox="0 0 340 90">
    <g transform="translate(6,6)" fill="none" stroke="#17140F">
      <circle cx="36" cy="36" r="30" stroke-width="9"/>
      <circle cx="36" cy="36" r="8" fill="#F2B705" stroke="none"/>
      <g stroke-width="5" stroke-linecap="round"><line x1="36" y1="28" x2="36" y2="12"/><line x1="43.6" y1="38.5" x2="58.8" y2="43.4"/><line x1="40.7" y1="42.5" x2="50.1" y2="55.4"/><line x1="31.3" y1="42.5" x2="21.9" y2="55.4"/><line x1="28.4" y1="38.5" x2="13.2" y2="43.4"/></g>
      <line x1="58" y1="58" x2="76" y2="76" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="100" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="101" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="amarelo"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/>
    <g transform="translate(12,12)" fill="none" stroke="#F2B705"><circle cx="33" cy="33" r="25" stroke-width="8"/><circle cx="33" cy="33" r="7" fill="#F2B705" stroke="none"/>
    <line x1="52" y1="52" x2="66" y2="66" stroke-width="10" stroke-linecap="round"/></g></svg></div>
</div>

<!-- C: Monograma G de bateia com pepita -->
<div class="op"><p class="n">C</p>
  <div class="amarelo"><svg width="330" height="90" viewBox="0 0 330 90">
    <g transform="translate(4,4)">
      <path d="M70 26 A34 34 0 1 0 74 46 L46 46" fill="none" stroke="#17140F" stroke-width="11" stroke-linecap="butt"/>
      <polygon points="25,43 28,34 35,30 41,34 42,43 37,49 29,49" fill="#17140F"/>
    </g>
    <text x="96" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="97" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="branco"><svg width="330" height="90" viewBox="0 0 330 90">
    <g transform="translate(4,4)">
      <path d="M70 26 A34 34 0 1 0 74 46 L46 46" fill="none" stroke="#17140F" stroke-width="11" stroke-linecap="butt"/>
      <polygon points="25,43 28,34 35,30 41,34 42,43 37,49 29,49" fill="#F2B705"/>
    </g>
    <text x="96" y="48" font-family="Barlow Condensed" font-weight="800" font-size="44" letter-spacing="1" fill="#17140F">GARIMPO</text>
    <text x="97" y="80" font-family="Barlow Condensed" font-weight="500" font-size="30" letter-spacing="9.5" fill="#17140F">CARRO</text>
  </svg></div>
  <div class="amarelo"><svg width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#17140F"/>
    <g transform="translate(10,10)"><path d="M70 26 A34 34 0 1 0 74 46 L46 46" fill="none" stroke="#F2B705" stroke-width="11"/><polygon points="25,43 28,34 35,30 41,34 42,43 37,49 29,49" fill="#F2B705"/></g></svg></div>
</div>

</body></html>
